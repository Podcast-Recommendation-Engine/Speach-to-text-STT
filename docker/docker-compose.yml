services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
    - "9092:9092" 
    - "29092:29092" 

    env_file:
      - ../.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - podcast-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 5

  stt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stt
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    networks:
      - podcast-network
    depends_on:
      kafka:
        condition: service_healthy

  podcast-scraper:
    image: ibrahimghali/podcast-scraper:latest
    container_name: podcast-scraper
    volumes:
      - ../data:/app/data
    networks:
      - podcast-network
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - kafka
      - stt


volumes:
  podcast-data:
    external: true
  kafka-data:
    external: true

networks:
  podcast-network:
    driver: bridge
    external: true

